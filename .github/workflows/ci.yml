name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+*"
  workflow_dispatch:

# Jobs widen this as they need to.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/devconcurrent-proxy

jobs:
  # Branch protection can require just this one.
  all-succeeded:
    name: All Succeeded
    if: always() && !startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    needs:
      - check
      - docker-crate
      - docker-image
      - docs
      - generated
    steps:
      - name: Check if all jobs succeeded
        uses: re-actors/alls-green@release/v1
        with:
          jobs: ${{ toJSON(needs) }}

  check:
    name: Check
    if: ${{ !startsWith(github.ref, 'refs/tags/') }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: nixbuild/nix-quick-install-action@v32
      - uses: nix-community/cache-nix-action@v6
        with:
          primary-key: nix-${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          paths: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
      - run: nix flake check --print-build-logs

  docker-crate:
    name: docker crate (${{ matrix.os }} / ${{ matrix.runtime }})
    if: ${{ !startsWith(github.ref, 'refs/tags/') }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            runtime: docker
          - os: ubuntu-latest
            runtime: podman
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: extractions/setup-just@v4
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest

      # Docker / podman setup
      - if: matrix.os == 'ubuntu-latest' && matrix.runtime == 'docker'
        name: "Ensure Docker"
        run: docker version
      - if: matrix.os == 'ubuntu-latest' && matrix.runtime == 'podman'
        name: "Install Podman"
        run: |
          sudo apt-get update
          sudo apt-get install -y podman
          systemctl --user enable --now podman.socket
          sock="/run/user/$(id -u)/podman/podman.sock"
          # Wait briefly for the socket to come up.
          for _ in $(seq 1 20); do [ -S "$sock" ] && break; sleep 0.5; done
          test -S "$sock"
          echo "DOCKER_HOST=unix://$sock" >> "$GITHUB_ENV"

      # Run tests
      - run: just test

  # Build-only; publishing happens on tags in `image` below.
  docker-image:
    name: Build service image
    if: ${{ !startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: nixbuild/nix-quick-install-action@v32
      - uses: nix-community/cache-nix-action@v6
        with:
          primary-key: nix-${{ runner.os }}-image-${{ hashFiles('flake.lock', '**/Cargo.lock') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-image-
      - run: nix build .#docker-service-image --print-build-logs

  generated:
    name: Generated files fresh
    if: ${{ !startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: extractions/setup-just@v4
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
      - run: just gen
      - name: Check for stale generated files
        run: |
          git diff --exit-code

  docs:
    name: Build book
    if: ${{ !startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: nixbuild/nix-quick-install-action@v32
      - uses: nix-community/cache-nix-action@v6
        with:
          primary-key: nix-${{ runner.os }}-docs-${{ hashFiles('flake.lock') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-docs-
      - run: nix build .#docs --print-build-logs
      # Copy out of the nix store so the artifact has writable, non-symlinked files.
      - name: Stage site
        run: |
          mkdir -p site
          cp -rL --no-preserve=mode,ownership result/. site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  docs-deploy:
    name: Deploy book
    needs: docs
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    # Never cancel a deploy that's in flight.
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # Images are published on tags only, alongside the binaries in release.yml.
  image:
    name: Image (${{ matrix.arch }})
    if: startsWith(github.ref, 'refs/tags/v')
    strategy:
      fail-fast: false
      matrix:
        include:
          - runs-on: ubuntu-latest
            arch: amd64
          - runs-on: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runs-on }}
    permissions:
      contents: read
      packages: write
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v5
      - uses: nixbuild/nix-quick-install-action@v32
      - uses: nix-community/cache-nix-action@v6
        with:
          primary-key: nix-${{ runner.os }}-${{ matrix.arch }}-${{ hashFiles('flake.lock', '**/Cargo.lock') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-${{ matrix.arch }}-

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine version
        id: version
        run: echo "version=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"

      - name: Build & push per-arch image
        run: |
          # GitHub's runner image hardcodes a v1 /etc/containers/registries.conf,
          # which the newer nix-provided skopeo refuses to load. Point it at a v2 file.
          mkdir -p "$RUNNER_TEMP/containers"
          printf 'unqualified-search-registries = ["docker.io"]\n' \
            > "$RUNNER_TEMP/containers/registries.conf"
          export CONTAINERS_REGISTRIES_CONF="$RUNNER_TEMP/containers/registries.conf"
          nix run .#docker-service-image.copyTo -- \
            "docker://${IMAGE}:${{ steps.version.outputs.version }}-${{ matrix.arch }}"

  image-manifest:
    name: Multi-arch manifest
    needs: image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha

      - name: Create manifests
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          VERSION: ${{ needs.image.outputs.version }}
        run: |
          while IFS= read -r tag; do
            [ -z "$tag" ] && continue
            docker buildx imagetools create \
              -t "$tag" \
              "${IMAGE}:${VERSION}-amd64" \
              "${IMAGE}:${VERSION}-arm64"
          done <<< "$TAGS"
