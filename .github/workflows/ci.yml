name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

# Jobs widen this as they need to.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Branch protection can require just this one.
  all-succeeded:
    name: All Succeeded
    if: always()
    runs-on: ubuntu-latest
    needs:
      - check
      - docker-crate
      - docker-image
      - docs
    steps:
      - name: Check if all jobs succeeded
        uses: re-actors/alls-green@release/v1
        with:
          jobs: ${{ toJSON(needs) }}

  check:
    name: Check
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: nixbuild/nix-quick-install-action@v32
      - uses: nix-community/cache-nix-action@v6
        with:
          primary-key: nix-${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          paths: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
      - run: nix flake check --print-build-logs

  docker-crate:
    name: docker crate (${{ matrix.os }} / ${{ matrix.runtime }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            runtime: docker
          - os: ubuntu-latest
            runtime: podman
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: extractions/setup-just@v4
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest

      # Docker / podman setup
      - if: matrix.os == 'ubuntu-latest' && matrix.runtime == 'docker'
        name: "Ensure Docker"
        run: docker version
      - if: matrix.os == 'ubuntu-latest' && matrix.runtime == 'podman'
        name: "Install Podman"
        run: |
          sudo apt-get update
          sudo apt-get install -y podman
          systemctl --user enable --now podman.socket
          sock="/run/user/$(id -u)/podman/podman.sock"
          # Wait briefly for the socket to come up.
          for _ in $(seq 1 20); do [ -S "$sock" ] && break; sleep 0.5; done
          test -S "$sock"
          echo "DOCKER_HOST=unix://$sock" >> "$GITHUB_ENV"

      # Run tests
      - run: just test

  # Build-only; publishing happens on tags, in release-image.yml.
  docker-image:
    name: Build service image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: nixbuild/nix-quick-install-action@v32
      - uses: nix-community/cache-nix-action@v6
        with:
          primary-key: nix-${{ runner.os }}-image-${{ hashFiles('flake.lock', '**/Cargo.lock') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-image-
      - run: nix build .#docker-service-image --print-build-logs

  docs:
    name: Build book
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: nixbuild/nix-quick-install-action@v32
      - uses: nix-community/cache-nix-action@v6
        with:
          primary-key: nix-${{ runner.os }}-docs-${{ hashFiles('flake.lock') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-docs-
      - run: nix build .#docs --print-build-logs
      # Copy out of the nix store so the artifact has writable, non-symlinked files.
      - name: Stage site
        run: |
          mkdir -p site
          cp -rL --no-preserve=mode,ownership result/. site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  docs-deploy:
    name: Deploy book
    needs: docs
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    # Never cancel a deploy that's in flight.
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
