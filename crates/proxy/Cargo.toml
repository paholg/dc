[package]
name = "devconcurrent-proxy"
version.workspace = true
edition.workspace = true
description = "DNS resolver for devconcurrent devcontainers"
homepage.workspace = true
repository.workspace = true
publish = false

[dependencies]
async-trait = "0.1.92"
axum = "0.8.9"
axum-reverse-proxy = { version = "1.3.0", default-features = false }
docker = { path = "../docker" }
eyre = "0.6.14"
fqdn = "0.5.2"
fqdn-trie = "0.5.0"
futures-util = "0.3.34"
hickory-proto = "0.26.1"
hickory-server = "0.26.1"
http = "1.5.0"
httparse = "1.10.1"
hyper = { version = "1.11.0", features = ["http1", "server"] }
hyper-util = { version = "0.1.20", features = ["service", "tokio"] }
indexmap.workspace = true
rcgen = { version = "0.14.9", features = ["pem", "x509-parser"] }
rustls = "0.23.43"
serde_json.workspace = true
shared = { path = "../shared" }
tokio = { workspace = true, features = ["full"] }
tokio-rustls = "0.26.4"
tower-http = { version = "0.7.0", features = ["set-header"] }
tracing = { workspace = true }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tower = { version = "0.5.3", features = ["util"] }

[lints]
workspace = true
