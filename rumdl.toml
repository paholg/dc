[global]
flavor = "gfm"
exclude = [
  # Machine-generated:
  "docs/src/reference/generated",
  # Fragments spliced into generated pages; not standalone documents:
  "docs/snippets",
]

[per-file-ignores]
# mdbook part titles are level-1 headings:
"docs/src/SUMMARY.md" = ["MD025"]

[MD013]
code_blocks = false

[MD033]
allowed = ["p", "a", "img"]
