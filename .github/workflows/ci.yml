name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

# Jobs widen this as they need to.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Branch protection can require just this one.
  all-succeeded:
    name: All Succeeded
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs:
      - check
      - docker-crate
      - docker-image
      - docs
      - generate-check
      - schema
      - trust-e2e
    steps:
      - name: Check if all jobs succeeded
        uses: re-actors/alls-green@release/v1
        with:
          jobs: ${{ toJSON(needs) }}

  check:
    name: Check
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: nixbuild/nix-quick-install-action@v32
      - uses: nix-community/cache-nix-action@v6
        with:
          primary-key: nix-${{ runner.os }}-cargo-${{ hashFiles('flake.lock', '**/Cargo.lock') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-cargo-
          # Keep one generation per lineage. These caches are ~2 GiB each and
          # the repo-wide budget is 10 GB; without this, old generations
          # accumulate until GitHub evicts the caches we actually want.
          purge: true
          purge-prefixes: nix-${{ runner.os }}-cargo-
          purge-created: 0
          purge-primary-key: never
      - run: nix flake check --print-build-logs

  docker-crate:
    name: docker crate (${{ matrix.os }} / ${{ matrix.runtime }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            runtime: docker
          - os: ubuntu-latest
            runtime: podman
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: extractions/setup-just@v4
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest

      # Docker / podman setup
      - if: matrix.os == 'ubuntu-latest' && matrix.runtime == 'docker'
        name: "Ensure Docker"
        run: docker version
      - if: matrix.os == 'ubuntu-latest' && matrix.runtime == 'podman'
        name: "Install Podman"
        run: |
          sudo apt-get update
          sudo apt-get install -y podman
          systemctl --user enable --now podman.socket
          sock="/run/user/$(id -u)/podman/podman.sock"
          # Wait briefly for the socket to come up.
          for _ in $(seq 1 20); do [ -S "$sock" ] && break; sleep 0.5; done
          test -S "$sock"
          echo "DOCKER_HOST=unix://$sock" >> "$GITHUB_ENV"

      # Run tests
      - run: just test

  # `dc proxy trust`/`untrust` against real trust stores. Linux only:
  # macOS 15 blocks headless trust-settings changes outright (the old
  # `security authorizationdb write com.apple.trust-settings.admin allow`
  # pre-allow now fails with -60005), so hosted macOS runners can't test
  # this. See actions/runner-images#11893 and rustls/rustls-native-certs#179.
  trust-e2e:
    name: Trust store e2e (ubuntu-latest)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
      - name: Install certutil
        run: sudo apt-get update && sudo apt-get install -y libnss3-tools
      - run: cargo build -p devconcurrent
      - run: bash .github/trust-e2e.sh
      - name: Fedora
        run: >-
          docker run --rm -v "$PWD:/src" -w /src fedora:42
          bash -c 'dnf install -y -q nss-tools openssl findutils && bash .github/trust-e2e.sh'
      - name: Arch
        run: >-
          docker run --rm -v "$PWD:/src" -w /src archlinux:base
          bash -c 'pacman -Sy --noconfirm --quiet nss openssl && bash .github/trust-e2e.sh'

  # Build-only; publishing happens on tags, in release-image.yml.
  docker-image:
    name: Build service image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: nixbuild/nix-quick-install-action@v32
      - uses: nix-community/cache-nix-action@v6
        with:
          primary-key: nix-${{ runner.os }}-image-${{ hashFiles('flake.lock', '**/Cargo.lock') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-image-
          purge: true
          purge-prefixes: nix-${{ runner.os }}-image-
          purge-created: 0
          purge-primary-key: never
      - run: nix build .#docker-service-image --print-build-logs

  generate-check:
    name: Check generated file freshness
    if: ${{ !startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: extractions/setup-just@v4
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
      - run: just gen
      - name: Check for stale generated files
        run: |
          test -z "$(git status --porcelain)" || { git status; git diff; exit 1; }

  schema:
    name: Validate JSON Schema
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: extractions/setup-just@v4
      - run: just check-schema

  docs:
    name: Build book
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: nixbuild/nix-quick-install-action@v32
      - uses: nix-community/cache-nix-action@v6
        with:
          primary-key: nix-${{ runner.os }}-docs-${{ hashFiles('flake.lock') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-docs-
          purge: true
          purge-prefixes: nix-${{ runner.os }}-docs-
          purge-created: 0
          purge-primary-key: never
      - run: nix build .#docs --print-build-logs
