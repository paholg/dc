[book]
title = "devconcurrent"
description = "Development environments made easy: git worktrees plus devcontainers, with DNS and a TLS-terminating proxy."
authors = ["Paho Lurie-Gregg"]
language = "en"
src = "src"

[preprocessor.tabs]

[output.html]
site-url = "/"
git-repository-url = "https://github.com/paholg/devconcurrent"
edit-url-template = "https://github.com/paholg/devconcurrent/edit/main/docs/{path}"
additional-css = ["theme/tabs.css", "theme/filename.css"]
additional-js = ["theme/tabs.js", "theme/filename.js"]
